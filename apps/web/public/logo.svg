  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 160"
  role="img"
  aria-label="Roufouf"
>
  <title>Roufouf  The civic knowledge archive</title>
  <g transform="translate(24 56)">
    <rect x="-4" y="48" width="56" height="4" rx="2" fill="#1B3F6E" opacity="0.2"/>
    <rect x="-4" y="58" width="56" height="4" rx="2" fill="#1B3F6E" opacity="0.15"/>
    <path
