services:
  db:
    image: postgres:16-alpine
    container_name: roufouf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roufouf
      POSTGRES_USER: roufouf
      POSTGRES_PASSWORD: roufouf-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roufouf -d roufouf"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: roufouf-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: roufouf-dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  directus:
    image: directus/directus:11
    container_name: roufouf-directus
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      KEY: roufouf-local-dev-key-change-me
      SECRET: roufouf-local-dev-secret-change-me
      PUBLIC_URL: http://localhost:8055

      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: roufouf
      DB_USER: roufouf
      DB_PASSWORD: roufouf-dev

      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: roufouf-dev

      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: ./uploads
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  postgres_data:
  meili_data:
  directus_uploads:
  directus_extensions:
