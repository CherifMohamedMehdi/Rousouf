services:
  db:
    image: postgres:16-alpine
    container_name: roufouf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roufouf
      POSTGRES_USER: roufouf
      POSTGRES_PASSWORD: roufouf-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roufouf -d roufouf"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: roufouf-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: roufouf-dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  directus:
    # Pin 10.x: seed script uses role-based `/permissions` (Directus 11+ uses policies).
    image: directus/directus:10.13.2
    container_name: roufouf-directus
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      KEY: roufouf-local-dev-key-change-me
      SECRET: roufouf-local-dev-secret-change-me
      PUBLIC_URL: http://localhost:8055

      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: roufouf
      DB_USER: roufouf
      DB_PASSWORD: roufouf-dev

      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: roufouf-dev

      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: ./uploads
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  backup:
    image: alpine:3.20
    container_name: roufouf-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-300}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_LOCAL_DIR: /backups/local
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: roufouf
      POSTGRES_USER: roufouf
      POSTGRES_PASSWORD: roufouf-dev
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_EMAIL: admin@example.com
      DIRECTUS_ADMIN_PASSWORD: roufouf-dev
      DIRECTUS_UPLOADS_DIR: /directus/uploads
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-roufouf}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      sh -c "apk add --no-cache postgresql16-client aws-cli tar gzip curl jq python3 dos2unix &&
      dos2unix /opt/backup/backup.sh /opt/backup/entrypoint.sh &&
      sh /opt/backup/entrypoint.sh"
    volumes:
      - directus_uploads:/directus/uploads:ro
      - backup_data:/backups/local
      - ./ops/backup:/opt/backup

  pdf-worker:
    build:
      context: ./workers/pdf-optimize
    container_name: roufouf-pdf-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      directus:
        condition: service_started
    environment:
      DATABASE_URL: postgres://roufouf:roufouf-dev@db:5432/roufouf
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      PDF_OPTIMIZE_SWEEP_MS: ${PDF_OPTIMIZE_SWEEP_MS:-120000}

volumes:
  postgres_data:
  meili_data:
  directus_uploads:
  directus_extensions:
  backup_data:
